<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Off-white background -->
  <rect width="1200" height="630" fill="#faf9f7"/>
  
  <!-- Subtle accent glows -->
  <circle cx="1000" cy="80" r="320" fill="#1d4ed8" opacity="0.05"/>
  <circle cx="180" cy="560" r="280" fill="#1d4ed8" opacity="0.04"/>
  
  <!-- Decorative top-left accent bar -->
  <rect x="0" y="0" width="1200" height="6" fill="#1d4ed8"/>
  
  <!-- Name -->
  <text x="600" y="270" text-anchor="middle" font-family="'Space Grotesk', 'Arial Black', Arial, sans-serif" font-size="76" font-weight="700" fill="#1a1a1a" letter-spacing="1">Maira Arshad</text>
  
  <!-- Role -->
  <text x="600" y="350" text-anchor="middle" font-family="'Space Grotesk', 'Arial', sans-serif" font-size="38" font-weight="600" fill="#1d4ed8" letter-spacing="0.5">Software Engineer</text>
  
  <!-- Divider line -->
  <line x1="480" y1="390" x2="720" y2="390" stroke="#1d4ed8" stroke-width="2.5" opacity="0.35" stroke-linecap="round"/>
  
  <!-- Tagline -->
  <text x="600" y="440" text-anchor="middle" font-family="'Inter', 'Arial', sans-serif" font-size="21" font-weight="400" fill="#5c5c5c">Backend-leaning full-stack developer building production systems.</text>
  
  <!-- Bottom-left small label -->
  <text x="60" y="580" font-family="'Inter', 'Arial', sans-serif" font-size="14" font-weight="500" fill="#6e6e6e" letter-spacing="2">MAIRAARSHAD.DEV</text>
</svg>